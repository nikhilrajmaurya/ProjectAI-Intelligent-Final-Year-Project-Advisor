<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="AI Project Idea Generator & Mentor for Final Year Projects - Discover personalized project ideas, blueprints, and milestone roadmaps with Gemini AI." />
    <title>AI Project Idea Generator & Mentor | Final Year Engineering</title>
    <!-- Prevent Theme Flash -->
    <script>
      (function() {
        try {
          var saved = localStorage.getItem('app-theme');
          var pref = window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
          var theme = (saved === 'dark' || saved === 'light') ? saved : pref;
          document.documentElement.classList.remove('dark', 'light');
          document.documentElement.classList.add(theme);
          document.documentElement.setAttribute('data-theme', theme);
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="antialiased min-h-screen">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
